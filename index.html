<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Match Timeline</title>
    <link rel="stylesheet" href="WebSite/styles.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="game-selector">
                <select id="gameSelect">
                    <option value="">-- Select a Match --</option>
                    <option value="CaboVerde_Argentina/CaboVerdevsArgentina_time_line.json">Cabo Verde vs Argentina</option>
                    <option value="CaboVerde_Spain/CaboVerdevsSpain_time_line.json">Cabo Verde vs Spain</option>
                </select>
            </div>
            <div id="timelineEvents" class="timeline-events content-hidden">
                <button id="timelineLeft" class="timeline-nav timeline-nav-left" type="button" aria-label="Scroll timeline left">&lt;</button>
                <div class="timeline">
                    <div id="timelineContent"></div>
                </div>
                <button id="timelineRight" class="timeline-nav timeline-nav-right" type="button" aria-label="Scroll timeline right">&gt;</button>
            </div>
        </div>

        <div id="content" class="content-hidden">
            <div class="timeline-container">
                <div class="timeline-images">
                    <div class="image-section">
                        <h3>Team 1: <span id="imageTeam1Label"></span></h3>
                        <img id="imageTeam1" src="" alt="Team 1 Section" />
                    </div>
                    <div class="image-section">
                        <h3>Team 2: <span id="imageTeam2Label"></span></h3>
                        <img id="imageTeam2" src="" alt="Team 2 Section" />
                    </div>
                </div>

            </div>
        </div>

        <div id="loadingMessage" class="loading-message">Loading match data...</div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script src="WebSite/script.js"></script>
</body>
</html>
